{{ define "main" }}
<article class="section-block post-single">
  <header class="post-single__header">
    <a href="{{ "blog/" | relURL }}" class="post-single__back">&larr; back to blog</a>
    <h1 class="post-single__title">{{ .Title }}</h1>
    <div class="post-single__meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">
        <i class="fa-regular fa-calendar"></i> {{ .Date.Format "02 Jan 2006" }}
      </time>
      {{ with .ReadingTime }}
      <span><i class="fa-regular fa-clock"></i> {{ . }} min read</span>
      {{ end }}
    </div>
    {{ with .Params.tags }}
    <div class="post-single__tags">
      {{ range . }}
        <span class="tag">{{ . }}</span>
      {{ end }}
    </div>
    {{ end }}
  </header>

  <div class="post-single__content">
    {{ .Content }}
  </div>

  <footer class="post-single__footer">
    <a href="{{ "blog/" | relURL }}" class="contact-btn contact-btn--secondary">
      <i class="fa-solid fa-arrow-left"></i> All Posts
    </a>
  </footer>
</article>
{{ end }}
